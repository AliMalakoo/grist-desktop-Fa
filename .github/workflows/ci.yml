name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

permissions:
  contents: read
  # Reporting browser-test failures as a pull-request comment.
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - ubuntu-22.04
          - windows-2022
        host:
          - x64
        target:
          - x64
        node:
          - 22
    name: ${{ matrix.os }} (node=${{ matrix.node }}, host=${{ matrix.host }}, target=${{ matrix.target }})
    steps:
      # yarn run test starts with a .sh script, which cmd cannot run unaided.
      - name: Set up bash association
        if: startsWith(matrix.os, 'windows')
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Match the Packaging workflow, which skips optional dependencies
        # because they add msgextract which fails on windows. Installing them
        # here would hide packaging-only build failures.
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Check version consistency
        if: startsWith(matrix.os, 'ubuntu')
        run: node ./scripts/check-metainfo-version-matches.js

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: ${{ matrix.os }}
          RUN_ARCH: ${{ matrix.target }}

      - name: Build
        run: yarn run build

      - name: Test
        timeout-minutes: 20
        run: yarn run test

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Run core browser tests against the desktop app
        timeout-minutes: 30
        shell: bash
        # Keep the output twice over: in the job log, and as annotations that survive when the raw
        # log cannot be downloaded. test-logs/ is uploaded on failure along with the screenshots.
        run: |
          mkdir -p test-logs
          set +e
          yarn run test:electron:upstream 2>&1 | tee test-logs/upstream-browser-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            node ./scripts/ci-test-annotations.js \
              test-logs/upstream-browser-tests.log --markdown test-logs/upstream-failures.md
          fi
          exit "$status"

      - name: Run core browser tests against the desktop app as a server
        # macos-15-intel, the slowest runner, has run past 30 minutes here.
        timeout-minutes: 45
        shell: bash
        run: |
          mkdir -p test-logs
          set +e
          yarn run test:electron:deployment 2>&1 | tee test-logs/deployment-browser-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            node ./scripts/ci-test-annotations.js \
              test-logs/deployment-browser-tests.log --markdown test-logs/deployment-failures.md
          fi
          exit "$status"

      - name: Report browser test failures on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! ls test-logs/*-failures.md >/dev/null 2>&1; then exit 0; fi
          {
            echo "### آزمون‌های مرورگری هسته شکست خوردند"
            echo
            cat test-logs/*-failures.md
          } > test-logs/comment.md
          gh pr comment "$PR_NUMBER" --body-file test-logs/comment.md

      - name: Save the logs from the browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.target }}
          path: test-logs/
          if-no-files-found: ignore
