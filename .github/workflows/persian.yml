name: Build Persian installers

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const v=require('./package.json').version; if ('v'+v !== process.env.GITHUB_REF_NAME) { console.error('Tag is ' + process.env.GITHUB_REF_NAME + ' but package.json is ' + v); process.exit(1); }"

      - name: Associate shell scripts with Git Bash
        # Use PowerShell to pass %1 literally to cmd; in a .cmd script it expands away.
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - name: Install dependencies
        shell: pwsh
        env:
          FORCE_COLOR: '0'
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'yarn-install.log'
          cmd /c "yarn install --network-timeout 300000 --ignore-optional > `"$log`" 2>&1"
          $status = $LASTEXITCODE
          Get-Content $log
          if ($status -ne 0) {
            Write-Host "::error title=Yarn exit code::$status"
            Get-Content $log -Tail 40 | ForEach-Object {
              $line = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Yarn output::$line"
            }
          }
          exit $status

      - name: Prepare the Persian core and Python sandbox
        run: yarn run setup
        env:
          RUN_ARCH: x64

      - name: Verify the applied Persian layer
        run: node ./scripts/apply-persian.js --check

      - name: Build
        run: yarn run build

      - name: Unit tests for the Persian layer
        shell: bash
        run: |
          yarn run build:tests
          export NODE_PATH="$(node -p "['core/_build','core/_build/ext','core/_build/stubs'].map(p => require('path').resolve(p)).join(require('path').delimiter)")"
          # parseDate.js is left out on purpose: it needs moment 2.29.4 from core's own
          # lockfile, while this workspace resolves moment-timezone's nested moment to 2.30.1,
          # where strict single-digit tokens reject leading zeros. That mismatch is upstream
          # and unrelated to the Persian layer; the layer's own tests are listed here.
          node ./node_modules/mocha/bin/mocha.js \
            core/_build/test/common/jalali.js \
            core/_build/test/common/ValueFormatter.js \
            core/_build/test/server/lib/sendAppPage.js

      - name: Smoke test
        timeout-minutes: 20
        run: yarn run test

      - name: Package unsigned installer
        run: yarn run electron --win nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: grist-desktop-fa-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Put the installer on a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "Grist Desktop فارسی $GITHUB_REF_NAME" \
              --notes "نسخهٔ فارسی Grist Desktop با تقویم جلالی، رابط راست‌به‌چپ و فونت وزیرمتن. فایل نصب امضای دیجیتال ندارد."
          gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Check version consistency
        run: node ./scripts/check-metainfo-version-matches.js

      - name: Prepare the Persian core and Python sandbox
        run: yarn run setup

      - name: Verify the applied Persian layer
        run: node ./scripts/apply-persian.js --check

      - name: Build
        run: yarn run build

      - name: Unit tests for the Persian layer
        run: |
          yarn run build:tests
          export NODE_PATH="$(node -p "['core/_build','core/_build/ext','core/_build/stubs'].map(p => require('path').resolve(p)).join(require('path').delimiter)")"
          # parseDate.js is left out on purpose: it needs moment 2.29.4 from core's own
          # lockfile, while this workspace resolves moment-timezone's nested moment to 2.30.1,
          # where strict single-digit tokens reject leading zeros. That mismatch is upstream
          # and unrelated to the Persian layer; the layer's own tests are listed here.
          node ./node_modules/mocha/bin/mocha.js \
            core/_build/test/common/jalali.js \
            core/_build/test/common/ValueFormatter.js \
            core/_build/test/server/lib/sendAppPage.js

      - name: Smoke test
        timeout-minutes: 20
        run: yarn run test

      - name: Package AppImage
        run: yarn run electron --linux AppImage --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: grist-desktop-fa-linux-x64
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
